services:
  mysql:
    image: mysql:8.0
    container_name: px-base-mysql
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3374}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: px_base
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - px-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: px-base-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6447}:6379"
    volumes:
      - redis-data:/data
    networks:
      - px-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: px-base-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8168}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: px_base
      DB_USER: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - adapt-logs:/app/logs
    networks:
      - px-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: px-base-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8167}:80"
    networks:
      - px-network

volumes:
  mysql-data:
  redis-data:
  adapt-logs:

networks:
  px-network:
    driver: bridge
